services:
  posiciones:
    image: ghcr.io/adiezdev/posiciones:latest
    container_name: posiciones
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      # La app escribe en /datos (DATOS_DIR del Dockerfile). Montarlo
      # en /app/datos dejaba los trabajos dentro del contenedor, y
      # cada actualizacion de watchtower se los llevaba por delante.
      - ./datos:/datos
    environment:
      - PYTHONUNBUFFERED=1
      # Cuantos dias se guardan las partituras ya terminadas.
      - RETENCION_DIAS=30
      - TZ=Europe/Madrid
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: posiciones-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REPO_USER: adiezdev
      REPO_PASS: ${GITHUB_TOKEN}
      DOCKER_API_VERSION: "1.41"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: Europe/Madrid
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
