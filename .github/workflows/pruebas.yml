name: pruebas

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  bateria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-pruebas.txt
      - name: Batería sintética y comparación con la base
        run: python pruebas/correr.py
